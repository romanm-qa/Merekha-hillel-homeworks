services:
  postgres:
    image: postgres:16
    container_name: homework_20_postgres
    environment:
      POSTGRES_DB: online_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - homework_20_postgres_data:/var/lib/postgresql/data

volumes:
  homework_20_postgres_data: